spring.application.name=shuttleflow
# Hosts such as Render tell the app which port to listen on through PORT.
server.port=${PORT:8080}

# Production/development default: PostgreSQL. Override these with environment
# variables or SPRING_DATASOURCE_* properties; credentials are never committed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shuttleflow}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:shuttleflow}
spring.datasource.password=${DB_PASSWORD:}
# Keep this small on hosted free tiers (Neon limits connections); 5 on Render.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Local default: drop, recreate and reseed on every start. Hosted (Render): SQL_INIT_MODE=never with
# DB_INIT_IF_EMPTY=true, so schema.sql and seed.sql run only into an empty database (DatabaseInitializer).
spring.sql.init.mode=${SQL_INIT_MODE:always}
shuttleflow.db.init-if-empty=${DB_INIT_IF_EMPTY:false}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Origins of the static frontend allowed to call the API with the session cookie.
shuttleflow.cors.allowed-origins=${SHUTTLEFLOW_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Notification service (the mock lives in this app at /mock-notifications).
shuttleflow.notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080}
shuttleflow.notification.connect-timeout-ms=1000
shuttleflow.notification.read-timeout-ms=2000
shuttleflow.notification.max-attempts=3
shuttleflow.notification.backoff-ms=200
shuttleflow.notification.max-rounds=5
shuttleflow.notification.poll-ms=30000
shuttleflow.notification.stale-after-seconds=60

# Gemini through Spring AI. Only the api-key is set: adding project-id or location
# switches Spring AI to Vertex AI, which rejects the free AI Studio key.
# Without GEMINI_API_KEY the placeholder lets the app boot; only AI calls then fail.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:not-set}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# M4 reminder agent: scan for appointments starting within 24h every 15 minutes.
shuttleflow.ai.reminder.poll-ms=${REMINDER_POLL_MS:900000}

# Login token (JWT, HS256) in an HttpOnly SameSite=Lax cookie. Set JWT_SECRET (32+ bytes) in any shared
# deployment; when it is unset a random secret is used and sign-ins reset on restart.
shuttleflow.jwt.secret=${JWT_SECRET:}
shuttleflow.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
# true behind HTTPS, so the browser only sends the cookie over TLS.
shuttleflow.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
