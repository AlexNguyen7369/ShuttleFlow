spring.application.name=shuttleflow

# Production/development default: PostgreSQL. Override these with environment
# variables or SPRING_DATASOURCE_* properties; credentials are never committed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shuttleflow}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:shuttleflow}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Origins of the static frontend allowed to call the API with the session cookie.
shuttleflow.cors.allowed-origins=${SHUTTLEFLOW_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
