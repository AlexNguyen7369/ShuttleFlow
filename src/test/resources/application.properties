spring.datasource.url=jdbc:h2:mem:shuttleflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
shuttleflow.cors.allowed-origins=http://localhost:5173
# Port 1 refuses instantly: tests never depend on a live notification service.
shuttleflow.notification.base-url=http://127.0.0.1:1
shuttleflow.notification.connect-timeout-ms=200
shuttleflow.notification.read-timeout-ms=200
shuttleflow.notification.max-attempts=2
shuttleflow.notification.backoff-ms=10
shuttleflow.notification.max-rounds=5
